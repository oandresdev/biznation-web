name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Despliegue (en main): aws s3 sync dist/biznation-web/browser s3://<bucket> --delete
      # + invalidación de CloudFront de /index.html. Ver docs/aws-architecture.md del backend.

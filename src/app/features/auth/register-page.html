<app-auth-frame heading="Crea tu cuenta">
  <form [formRoot]="registerForm" class="auth-form">
    @if (formError(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }

    <div class="field">
      <label for="name">Nombre completo</label>
      <input id="name" class="input" autocomplete="name" [formField]="registerForm.name"
        [attr.aria-invalid]="registerForm.name().touched() && registerForm.name().invalid()" aria-describedby="name-error" />
      <app-field-error id="name-error" [state]="registerForm.name()" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" class="input" type="email" autocomplete="email" [formField]="registerForm.email"
        [attr.aria-invalid]="registerForm.email().touched() && registerForm.email().invalid()" aria-describedby="email-error" />
      <app-field-error id="email-error" [state]="registerForm.email()" />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" class="input" type="password" autocomplete="new-password" [formField]="registerForm.password"
        [attr.aria-invalid]="registerForm.password().touched() && registerForm.password().invalid()" aria-describedby="password-hint password-error" />
      <span id="password-hint" class="hint">Mínimo 8 caracteres.</span>
      <app-field-error id="password-error" [state]="registerForm.password()" />
    </div>

    <div class="field">
      <label for="phone">WhatsApp (opcional)</label>
      <input id="phone" class="input" type="tel" inputmode="numeric" autocomplete="tel" [formField]="registerForm.phone"
        [attr.aria-invalid]="registerForm.phone().touched() && registerForm.phone().invalid()" aria-describedby="phone-hint phone-error" />
      <span id="phone-hint" class="hint">Para responderte por WhatsApp. Ej.: 573001234567</span>
      <app-field-error id="phone-error" [state]="registerForm.phone()" />
    </div>

    <button type="submit" class="btn btn-primary submit" [disabled]="registerForm().submitting()">
      {{ registerForm().submitting() ? 'Creando cuenta…' : 'Crear cuenta' }}
    </button>
  </form>

  <p class="switch">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</app-auth-frame>
